[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-bot"
version = "0.1.0"
description = "Event-driven cryptocurrency market-data and automated trading platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "httpx>=0.27,<1.0",
    "websockets>=14,<16",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "PyYAML>=6.0,<7.0",
    "structlog>=24.4,<26.0",
    "pyarrow>=20,<25",
    "tzdata>=2025.2,<2027"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
    "types-PyYAML>=6.0,<7.0"
]

[project.scripts]
trading-bot = "trading_bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: tests that communicate with external systems"
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["trading_bot"]